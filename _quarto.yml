project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!outdated/"

website:
  site-url: "https://swoo-han.github.io"
  title: "Sangwoo Han"
  page-footer: "© 2026 Sangwoo Han · Built with Quarto · Hosted on GitHub Pages"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: CV
        href: vita/cv-han.pdf
      - text: Research
        href: research/index.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/sangwooh/
  open-graph: true

format:
  html:
    theme:
      light:
        - cosmo
        - theme.scss
      dark:
        - cosmo
        - theme-dark.scss
    css: styles.css
    toc-location: right

execute:
  freeze: auto
